# Shadowrocket — Clash-ALL 双订阅 Claude 版迁移
# 生成日期：2026-10-03（Asia/Taipei）
# 来源：用户确认的 clash-all-fallbackdual-claude.yaml。
# 使用：先在首页导入原有两份节点订阅，再导入并使用本文件，全局路由设为“配置”。
# 本 .conf 完整提供 DNS、分组和分流；节点订阅由 Shadowrocket 首页单独管理。
# 原文件仅提供订阅 URL，没有可内嵌的实际代理节点；不编造节点或使用 Surge policy-path。
# 双订阅节点由 policy-regex-filter 合并筛选；若首页还有其他订阅，其节点也可能被筛入。
# 需仅限这两个订阅时，在分组 UI 开启“订阅”并选择这两份订阅。
# 原订阅地址（私人凭据，请勿公开分享此文件）：
# 订阅 1：https://is.domainforsub.work/sub/8456c2a62865e603/clash
# 订阅 2：https://jpdj.ytfbtk.top:2096/clash/m50nxsdibdkom5wv
#
# 验证范围：已下载检查全部 37 个上游列表，保留远程引用，不复制/转换业务域名。
# 原 Clash default 以“直连”为首项；海外业务在本迁移中明确默认代理，国内默认 DIRECT。
# Test、Block 原策略组保留，但本次已确认的上游分类没有对应规则，因此不绑定虚构列表。
# Meta 列表覆盖整个 Meta 服务族；Facebook/WhatsApp 放在其前面，使独立社交策略优先生效。
# Crunchyroll 等未列出的服务由国外/FINAL 兜底。
#
# 兼容性：本机 Shadowrocket 2.2.92 (3445) 已确认含 direct-dns-server、proxy-dns-server。
# dns-fallback-system 属于旧配置常见隐藏开关，本机未确认其解析支持；不可单独依赖它。
# 显式加密 fallback-dns-server 才是这里避免空值/system 回退的主要配置。
# 当前 9 份 classical 域名列表含 DOMAIN-REGEX，共 167 条；本机未确认支持。
# 文件保持上游原始引用；旧版可能忽略这些行或报解析错误，无法宣称全量规则兼容。
# 如编译报 DOMAIN-REGEX 错误，不要把该规则集视为已成功加载；需在目标客户端确认。
# 没有复制、替换或自建这些正则域名的本地规则。
#
[General]
ipv6 = false
prefer-ipv6 = false
dns-direct-system = false
dns-fallback-system = false
dns-direct-fallback-proxy = true

# 需要由客户端解析的非直连查询：海外 DoH，使用首页选定的默认代理节点。
# 使用文档明确示例的 #proxy；不假设 #proxy=中文策略组 与 Clash #策略组 等价。
# 首页须选定可用默认节点；该 DNS 代理不保证与每个业务组的出口相同。
dns-server = https://1.1.1.1/dns-query#proxy,https://1.0.0.1/dns-query#proxy
# 命中 DIRECT 的域名规则：国内 DoH；下列 IP 字面地址省去 DoH 域名的引导解析。
direct-dns-server = https://223.5.5.5/dns-query,https://1.12.12.12/dns-query
# 显式指定备用 DoH，不能留空或填 system。国内 DoH 失败时也可能用此海外备用。
fallback-dns-server = https://1.0.0.1/dns-query#proxy,https://1.1.1.1/dns-query#proxy
# 仅解析代理服务器的域名：国内直连 DoH，避免尚未建立的代理解析自身。
# proxy-dns-server 不是“代理业务 DNS”；不要误写成通过代理的循环依赖。
proxy-dns-server = https://223.5.5.5/dns-query,https://1.12.12.12/dns-query
# 代理业务通常保留域名交给节点远端解析；远端 DNS 由节点控制，不保证都用上述 DoH。
# 不开启 always-ip-address 强制本地解析，以保留该远端解析行为。

# 只使用已见于 Shadowrocket 原生配置的 IP:53 写法，拦截这些常见硬编码 DNS。
# 不使用未确认的 Mihomo any:53 / 0.0.0.0:53 或通配 :53。
# 此列表不代表劫持所有 53 端口，也不控制应用自行使用的 DoH/DoT。
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,223.5.5.5:53,223.6.6.6:53,119.29.29.29:53,1.12.12.12:53
private-ip-answer = true
udp-policy-not-supported-behaviour = REJECT
# LAN 由 Rule 中的 private 规则直连；不排除整段 LAN TUN 路由，以免本地 53 查询绕过接管。
# skip-proxy 只是切换接口处理，不能当作 DIRECT 策略；这里不用它替代 LAN 规则。
# ipv6=false 不能保证关闭系统 IPv6 或节点域名的 IPv6 连接；节点侧仍需检查 IPv4 设置。

[Proxy]
# 实际节点来自首页的两份订阅，原 Clash 文件没有可在此转换的静态代理节点。

[Proxy Group]
# select / url-test / fallback 使用 Shadowrocket 语法；不移植 use/include-all/lazy。
# policy-regex-filter 扫描首页节点；地区为空时请选 PROXY 或其他有节点的地区。
# tolerance=50 毫秒；interval=300 秒；timeout=5 秒。
所有-手动 = select,policy-regex-filter=^((?!(直连|拒绝|剩余|到期|过期|流量|官网|DIRECT|REJECT)).)*$
所有-自动 = url-test,policy-regex-filter=^((?!(直连|拒绝|剩余|到期|过期|流量|官网|DIRECT|REJECT)).)*$,url=https://www.gstatic.com/generate_204,interval=300,timeout=5,tolerance=50

香港-手动 = select,policy-regex-filter=(广港|香港|HK|Hong Kong|🇭🇰|HongKong)
香港-自动 = url-test,policy-regex-filter=(广港|香港|HK|Hong Kong|🇭🇰|HongKong),url=https://www.gstatic.com/generate_204,interval=300,timeout=5,tolerance=50
