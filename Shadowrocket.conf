# ---------------------------------------------------------

AI工具 = select,PROXY,国外,DIRECT
Claude = select,PROXY,国外,DIRECT


# ---------------------------------------------------------
# 社交通讯
# ---------------------------------------------------------

Telegram = select,PROXY,国外,DIRECT
社交通讯 = select,PROXY,国外,DIRECT


# ---------------------------------------------------------
# Google
# ---------------------------------------------------------

Google = select,PROXY,国外,DIRECT
YouTube = select,PROXY,国外,DIRECT


# ---------------------------------------------------------
# Development
# ---------------------------------------------------------

GitHub = select,PROXY,国外,DIRECT


# ---------------------------------------------------------
# Streaming
# ---------------------------------------------------------

流媒体 = select,PROXY,国外,DIRECT


# ---------------------------------------------------------
# Crypto
# ---------------------------------------------------------

Crypto = select,PROXY,国外,DIRECT


# ---------------------------------------------------------
# Amazon
# ---------------------------------------------------------

Amazon = select,PROXY,国外,DIRECT


# ---------------------------------------------------------
# Apple
